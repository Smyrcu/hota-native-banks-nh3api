; native_banks.ini — konfiguracja pluginu "Native Bank Rewards" do HotA.
; Plik leży obok native_banks.dll (w folderze pluginu HD Moda).

[NativeBanks]
; Włącz/wyłącz plugin. 0 = wyłączony (zachowanie vanilla).
Enabled=1

; Logowanie debug do native_banks.log (obok DLL). 0 = tylko INFO/ERROR.
Debug=0

; Jezyk komunikatow (popup startowy + dialog wyboru nagrody Factory):
;   auto = wykrywany z JEZYKA GRY (teksty genrltxt w pamieci); paczka PL -> pl,
;          RU -> ru, inne/nierozpoznane -> en. Albo na sztywno: pl / en / ru.
; Uwaga: napis w dialogu w grze renderuje font gry — "ru" zaklada rosyjska
; wersje gry (cyrylica CP1251); popup startowy dziala zawsze (Unicode).
Language=auto

; Źródło frakcji odbiorcy nagrody:
;   0 = frakcja gracza — startowe miasto (domyślne; fallback: klasa bohatera)
;   1 = frakcja klasy bohatera odbierającego nagrodę
FactionMode=0

; Tryb liczenia ilości nagrody:
;   0 = zachowaj oryginalną liczbę (tier-parity)
;   1 = przelicz po AI value: liczba = round(oryg_liczba * AI(oryginal) / AI(native))
CountMode=1

; Jednostka t7 dla Factory (miasto ma dwie):
;   0 = Couatl, 1 = Dreadnought, 2 = wybór gracza w dialogu (AI dostaje Couatla)
FactoryTier7=2

; Mnożnik liczby jednostek nagrody per frakcja ODBIORCY, w procentach.
; 100 = bez zmian, 80 = 80% (mniej), 150 = 150% (więcej). Zakres 0-500.
; Działa tylko na nagrody jednostkowe frakcyjne (neutrale nietknięte).
; Do balansu PvP — np. słabszym frakcjom podnieś, mocniejszym utnij.
[CountMultiplier]
Castle=100
Rampart=100
Tower=100
Inferno=100
Necropolis=100
Dungeon=100
Stronghold=100
Fortress=100
Conflux=100
Cove=100
Factory=100
Bulwark=100

; Twarde nadpisanie liczby jednostek per (frakcja odbiorcy, tier nagrody, stan banku).
; Format: <Frakcja>.Tier<1-7> = c1,c2,c3,c4  — 4 stany banku od najsłabszego.
; Ma pierwszeństwo przed [CountMultiplier]. Wartości 0-127.
[CountOverride]
; Wyłączone na rzecz CountMode=1 (AI value). Odkomentuj, by wymusić ręczne wartości
; (override ma pierwszeństwo przed AI value i mnożnikiem):
;Dungeon.Tier6=5,8,10,16
;Dungeon.Tier7=1,2,3,5
